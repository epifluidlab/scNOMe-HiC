# Per-project pipeline config — self-contained.
#
# Pass as the ONLY --configfile to snakemake. Every field the pipeline needs is
# set here. This is the CONSOLIDATED meningioma project: cells from all three
# data batches (data_batch_1/2/3) are processed together under one workdir.
# ──────────────────────────────────────────────────────────────────────────

# ─── 1. PROJECT-SPECIFIC ──────────────────────────────────────────────────

# Absolute path to this project's working directory.
workdir: "${WORK_ROOT}/meningioma"

# Pipeline starting mode:
#   "raw"     — start from raw paired fastqs in `data/` (runs demultiplex + fastqc + trim)
#   "trimmed" — start from already-trimmed fastqs in `trimmed_data/`
#               (skips demux + fastqc + trim)
# We start from already-trimmed fastqs: all three batches were demultiplexed +
# trim_galore'd previously; merged_trimmed/ symlinks every cell's val files.
start_from: "trimmed"

# Raw fastq directory. Used when start_from == "raw". (unused here)
data: "00.raw_data/"

# Single-cell index file. OPTIONAL in trimmed mode — left unset so the pipeline
# auto-discovers every {prefix}.{index} pair present in merged_trimmed/. The
# three batches used different barcode sets, so auto-discovery is the cleanest
# option (no barcode whitelist to maintain).
# fileindex: "index.txt"

# Trimmed-fastq directory — the scan dir for auto-discovery and the input dir
# for the `mapping` rule. merged_trimmed/ holds symlinks to the val_1/val_2
# fastqs of all 348 cells across data_batch_1/2/3.
trimmed_data: "${WORK_ROOT}/meningioma/merged_trimmed"

# Auto-discover every (prefix, index) pair in trimmed_data (default — both
# fastq_prefixes and fastq_prefixes_file left unset).

# ─── 2. SHARED PATHS (hg38 — human meningioma) ────────────────────────────

reference: "${REFERENCE_ROOT}/hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set"
variants: "${REFERENCE_ROOT}/hg38/Homo_sapiens_assembly38.dbsnp138.vcf"
restriction_sites: "${REFERENCE_ROOT}/hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fa_DpnII.txt"
# enzyme_list left unset → mapping rule falls back to the hg38 default
# {reference}.DpnII.span_region.bedgraph (present on disk).

picard: "${SOFTWARE_ROOT}/picard/picard.jar"
bisulfitehic: "${SOFTWARE_ROOT}/bisulfiteHic"
bissnp_jar: "${SOFTWARE_ROOT}/Bis-tools/Bis-SNP/Bis-SNP.latest.jar"
bistools: "${SOFTWARE_ROOT}/Bis-tools"
scripts: "${SOFTWARE_ROOT}/sc_NOMeHiC_pipeline/scripts"

# GCHnorm intervals (only needed if rules/GCHnorm.smk is enabled; it is not).
hg38_5kb_no_dark_regions: "${REFERENCE_ROOT}/hg38/hg38.autosomes.5kb_interval.no_dark_regions.bed"

# Whitelist of cells for hicluster's expensive impute/embed stage.
# Generated by QC (qc_plots.ipynb) after alignment+methylation finish, then the
# hicluster_selected rule is invoked explicitly. Not used by the default run.
# Left UNSET for the alignment+methylation phase (hiccluster.smk errors at parse
# time if it points at a file that doesn't exist yet). Uncomment + point at
# QC/meningioma_passed.txt once QC has been run.
# selected_cells_file: "QC/meningioma_passed.txt"

# ─── 3. TUNING ────────────────────────────────────────────────────────────

# Methylation per-bin output. One TSV per (cell, context, bin_def) under
# 08.methylation_snakemake/. Both GCH and HCG contexts are always computed.
methylation_bin_sizes:
  - 1000
  - 50000
  - 100000
  - 250000

# Custom region BEDs (label → bed path). Header rows are auto-skipped.
# Three regions to match the cortex (sc_nomehic/snakemake) config: gene_tss,
# gene_body, gene. `gene` was added for config parity; it triggers per-cell
# methylation_region jobs for that label on the next pipeline launch.
methylation_region_beds:
  gene_tss:  ${REFERENCE_ROOT}/hg38/genome_bins_gene_tss.bed.gz
  gene_body: ${REFERENCE_ROOT}/hg38/genome_bins_gene_body.bed.gz
  gene:      ${REFERENCE_ROOT}/hg38/genome_bins_gene.bed.gz

# Adapter trimming parameters (used by demultiplex_fastqc_trim → trim_galore;
# unused here since start_from == trimmed, kept for completeness).
clip_r1: 15
clip_r2: 15
three_prime_clip_r1: 5
three_prime_clip_r2: 5

# QC analysis thresholds (rule qc + qc_plots.ipynb).
# ── SHARED QC FILTER ──────────────────────────────────────────────────────
# These are the thresholds common to BOTH reference snakemake projects
# (sc_nomehic_cellline = human cellline, sc_nomehic = mouse cortex). We adopt
# this shared set for the meningioma sample set, replacing the older per-batch
# meningioma config (which used fragnum=80000 + transrate=0.7). No transrate
# bound is applied. A cisnum_max upper bound is added to drop high-depth
# outliers / suspected doublets (picked visually from the doublet histograms).
# All are LOWER bounds (cell passes iff metric > threshold) EXCEPT noncpg_threshold
# and cisnum_max_threshold (UPPER bounds; cell passes iff metric < threshold).
fragnum_threshold: 100000
noncpg_threshold: 5
GCH_threshold: 1000000
HCG_threshold: 150000
cis1kbnum_threshold: 2000
# Upper bound on cisnum — drops outlier high-depth cells / suspected doublets.
# Chosen at 3M from the doublet inspection histograms (drops the top shoulder of
# 7 cells: the 24.6M big cell + MY_24/MY_14/MY_2/MY_39/NU04113_p2_06.GCCAAT/MY_46).
cisnum_max_threshold: 3000000

# hicluster resolutions (used only by the explicit hicluster_selected rule).
hicluster_resolutions:
  - 100000
  - 250000
